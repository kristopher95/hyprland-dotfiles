# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(220, 220, 220, 0.9)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 64
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(20, 20, 20, 0.55)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(120, 170, 255, 0.8)
    fail_color = rgba(255, 80, 80, 0.8)
    position = 0, -80
    halign = center
    valign = center
}
